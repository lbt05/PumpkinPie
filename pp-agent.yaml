# pumpkinPie agent configuration.
#
# One file holds every knob the agent exposes. Leave a field blank
# (or omit it) to use the built-in default shown in the comment.
#
# Run with:
#     pp agent
#     pp agent --config=/path/to/this.yaml

# gRPC address of the master to register with. Format: "host:port".
# Default: "pp-master.internal:7000" — override to your master's
# actual address, e.g. "10.0.0.1:7000".
master: "0.0.0.0:7001"

# Human-readable node name shown in the dashboard. Empty (default)
# means the agent uses os.Hostname() at startup.
name: ""

# Directory for persistent agent state (the machine-id file lives
# here so renaming the host or restarting the agent does not
# register as a new node on the master). Leave empty (default) for
# the platform-appropriate path:
#   /var/lib/pp-agent            on Linux (systemd unit)
#   $XDG_STATE_HOME/pumpkinpie   on Linux/macOS without systemd
#   ~/.local/state/pumpkinpie    fallback
#
# Set explicitly for non-standard layouts, e.g. when running the
# agent under a dedicated service user or in a container.
state_dir: ""

# Path to the Docker daemon unix socket. Empty (default) means:
#   /var/run/docker.sock  on Linux (standard)
# Override for rootless Docker, Docker Desktop, or remote setups:
#   /run/user/1000/docker.sock   (rootless)
#   $HOME/.docker/run/docker.sock  (Docker Desktop on macOS)
# Env-var fallback still works for ad-hoc runs: DOCKER_SOCK=/path
# ./bin/pp agent --config=...
docker_sock: ""

# How often the agent reconciles the master's view of each container
# against Docker's true state. Runs alongside Docker's /events stream:
# events gives sub-second updates when supported; this poll catches
# everything events misses (Docker Desktop for Mac has long-standing
# /events issues, some embedded container runtimes don't expose it
# at all). On platforms where events work the poll is just a
# drift-correction safety net.
#
# Go duration syntax. Default (empty): 10s. Set to "0s" to disable
# polling entirely — only do this on platforms where you've verified
# /events works, otherwise out-of-band `docker stop` on the agent
# will leave the master showing the old state.
container_poll_interval: ""

# Whether to subscribe to Docker's /events stream for sub-second state
# updates. Default: true. Set to false on platforms where /events
# doesn't work (Docker Desktop for Mac historically closes the
# long-poll connection immediately, which makes the agent retry
# every second). When false, the polling loop above is the only
# sync path — out-of-band `docker stop` shows up within one poll
# interval (default 10s).
docker_events: true
