# Release pumpkinPie
#
# Two jobs:
#   - smoke: runs on every push + PR — builds Go + web, runs tests,
#     and runs `goreleaser check` so config drift is caught early.
#   - release: runs when a GitHub Release is published (via the UI or
#     API) with a `v*` tag, or via manual dispatch. Builds the web UI
#     so it's embedded into the binary, then GoReleaser produces the
#     cross-compile matrix and uploads assets to the existing release.
#
# Required secret: GITHUB_TOKEN (provided automatically by Actions).

name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to release (must already exist on the repo)'
        required: true

permissions:
  contents: write   # needed to create the GitHub Release

concurrency:
  # Cancel in-progress runs on the same event+ref; never cancel an in-flight release.
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  # ------------------------------------------------------------
  # 1) Smoke gate — runs on every PR and every push to main.
  # ------------------------------------------------------------
  smoke:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Must match the `go` directive in go.mod so the toolchain
          # auto-download doesn't kick in (saves ~30s on first run).
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate proto
        uses: ./.github/actions/setup-proto

      - name: Build web assets
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build + test (Linux/amd64)
        run: |
          make build
          bin/pp version
          go test ./...

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

  # ------------------------------------------------------------
  # 2) Release — runs on `v*` release published (and manually for hotfixes).
  # ------------------------------------------------------------
  release:
    name: cut release
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')) ||
      github.event_name == 'workflow_dispatch'
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Generate proto
        uses: ./.github/actions/setup-proto

      - name: Build web assets
        # web/embed.go does //go:embed all:dist, so web/dist must exist
        # before GoReleaser runs `go build` — otherwise the embed is empty
        # and the served UI 404s.
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          # --clean: wipe dist/ before building
          # Publish is not skipped: the existing release (created by the
          # UI/API) is updated with the built artifacts and checksums.
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
